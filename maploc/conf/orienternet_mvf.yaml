defaults:
  - data: yyc
  - model/image_encoder: resnet_fpn
  - training
  - _self_

model:
  name: orienternet
  latent_dim: 128
  matching_dim: 8
  z_max: 32
  x_max: 32
  pixel_per_meter: ${data.pixel_per_meter}
  num_scale_bins: 33
  num_rotations: 64
  do_label_smoothing: false
  image_encoder:
    backbone:
      encoder: resnet101
  map_encoder:
    embedding_dim: 16
    output_dim: ${..matching_dim}
    num_classes: ${data.num_classes}
    backbone:
      encoder: vgg19
      pretrained: false
      output_scales: [0]
      num_downsample: 3
      decoder: [128, 64, 64]
      padding: replicate
    unary_prior: false
  bev_net:
    num_blocks: 4
    latent_dim: ${..latent_dim}
    output_dim: ${..matching_dim}
    confidence: true

data:
  name: yyc
  paths: 
    data_dir: "./datasets/YYC"
    osm_dir: "/home/kevinmeng/workspace/mappedin/VPS/OrienterNet/yyc_osms"
    mvf_dir: "/home/kevinmeng/workspace/mappedin/VPS/MVF/YYC"

    combined_geojson_path: "/home/pascale/Documents/VPS/Mappedin_VPS_Data/YYC_VPS/user_data/combined-output.geojson"
    photos_dir: "/home/pascale/Documents/VPS/Mappedin_VPS_Data/YYC_VPS/user_data/photos"
    split_file: "/home/pascale/Documents/VPS/OrienterNet/image_splits.json"
    map_data_path: "/home/pascale/Documents/VPS/OrienterNet_MVF/map_data.pkl"
    raster_map_path: "/home/pascale/Documents/VPS/OrienterNet_MVF/"
    area_index_path: "/home/pascale/Documents/VPS/OrienterNet_MVF/layer_to_index.json"
    line_index_path: "/home/pascale/Documents/VPS/OrienterNet_MVF/line_to_index.json"
  scenes:
    - f_64ff43abbf8c6fef25f86282
    - f_64ff43e17107d168de589c1a
    - f_64ff44007107d168de589c1b
    - f_6509bfcef7649384963d5949
    - f_6509bfee66c66bc61ee6b49c
    - f_6509c038f7649384963d594a
  split: image_splits.json
  loading:
    train:
      batch_size: 1 # was 12 but OOM
      num_workers: ${.batch_size}
    val:
      batch_size: ${..train.batch_size}
      num_workers: ${.batch_size}
    test:
      batch_size: ${..train.batch_size}
      num_workers: ${.batch_size}
  # map data
  num_classes:
    areas: 27
    nodes: 1
    ways: 2
  pixel_per_meter: 2
  crop_size_meters: 64
  max_init_error: 48
  add_map_mask: false
  map_resize_dim: 360
  mask_radius: 
  mask_pad: 1
  # preprocessing
  resize_image: 512
  pad_to_square: true
  rectify_pitch: true
  augmentation:
    rot90: true
    flip: false # was true
    image: {apply: true}
  random: true
  seed: 0

train:
  experiment:
    name: ???
    gpus: 1
    seed: 0
    pretrained_path: "experiments/OrienterNet_MVF_YYC_pretrain_cropmap/best-model-epoch-01.pt"
    clearml: true
  training:
    lr: 1e-4 # 1e-4
    lr_scheduler: null
    finetune_from_checkpoint: null
    trainer:
      max_epochs: 200
      save_epoch: 9
      check_val_every_n_epoch: 1
      limit_val_batches: 1000
      devices: ${experiment.gpus}
    checkpointing:
      monitor: "loss/total/val"
      save_top_k: 5
      mode: "min"
  hydra:
    job:
      name: ${experiment.name}
      chdir: false

clearml:
  project_name: "OrienterNet"
  task_name: "orienternet_training"
  output_uri: true
  dataset_id:  # for YYC images: e5bce8143ec6423cac891a31f123bb9a # for e57: d39cb0ea44c04b23870dde88f8b7b583 # orienternet_dataset_test: a0ca14beec574088b23e64820ad6e690