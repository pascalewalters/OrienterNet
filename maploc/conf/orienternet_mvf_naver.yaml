defaults:
  - data: yyc
  - model/image_encoder: resnet_fpn
  - training
  - _self_

model:
  name: orienternet
  latent_dim: 128
  matching_dim: 8
  z_max: 32
  x_max: 32
  pixel_per_meter: ${data.pixel_per_meter}
  num_scale_bins: 33
  num_rotations: 64
  do_label_smoothing: false
  image_encoder:
    backbone:
      encoder: resnet101
  map_encoder:
    embedding_dim: 16
    output_dim: ${..matching_dim}
    num_classes: ${data.num_classes}
    backbone:
      encoder: vgg19
      pretrained: false
      output_scales: [0]
      num_downsample: 3
      decoder: [128, 64, 64]
      padding: replicate
    unary_prior: false
  bev_net:
    num_blocks: 4
    latent_dim: ${..latent_dim}
    output_dim: ${..matching_dim}
    confidence: true
  regularization:
    dropout_rate: 0.1
    l2_weight: 1e-4
    feature_norm: true
    gradient_clip: 1.0
  debug_metrics: true
  metric_log_interval: 100  # Log detailed metrics every N steps
  validation_visualization: true  # Save validation prediction visualizations

data:
  name: naver
  paths:
    combined_geojson_path: "/home/pascale/Documents/VPS/WayIL/Naver/naver_orienternet_data/merged.geojson"
    photos_dir: "/home/pascale/Documents/VPS/WayIL/Naver/naver_orienternet_data/merged_images/"
    valid_dir: ""
    split_file: "/home/pascale/Documents/VPS/WayIL/Naver/naver_orienternet_data/merged_splits.json"
    mvf_data_path: "/home/pascale/Documents/VPS/WayIL/Naver/naver_orienternet_data/mvf_data/"
    raster_map_path: "/home/pascale/Documents/VPS/WayIL/Naver/naver_orienternet_data/raster_maps"
    area_index_path: "/home/pascale/Documents/VPS/WayIL/Naver/naver_orienternet_data/area_index_mapping.json"
    line_index_path: "/home/pascale/Documents/VPS/WayIL/Naver/naver_orienternet_data/line_index_mapping.json"
  loading:
    train:
      batch_size: 1 # was 12 but OOM
      # num_workers: ${.batch_size}
      num_workers: 1
    val:
      batch_size: ${..train.batch_size}
      num_workers: ${.batch_size}
    test:
      batch_size: ${..train.batch_size}
      num_workers: ${.batch_size}
  # map data
  num_classes:
    areas: 3
    ways: 4
    nodes: 1
  pixel_per_meter: 2
  crop_size_meters: 64
  max_init_error: 48
  add_map_mask: true
  map_resize_dim: 256
  mask_radius: 
  mask_pad: 1
  # preprocessing
  resize_image: 256
  pad_to_square: true
  rectify_pitch: true
  augmentation:
    rot90: true
    flip: true # was true
    image: {apply: true, brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.1}
  random: true
  seed: 0

train:
  experiment:
    name: ???
    gpus: 1
    seed: 0
    pretrained_path: "orienternet_mgl.ckpt"
    clearml: true
  training:
    lr: 1e-4 # 1e-4
    lr_scheduler:
      # Option 1: StepLR - decreases lr by gamma every step_size epochs
      name: "step"
      step_size: 3
      gamma: 0.1
    finetune_from_checkpoint: null
    trainer:
      max_epochs: 10
      save_epoch: 9
      check_val_every_n_epoch: 1
      limit_val_batches: 1000
      devices: ${experiment.gpus}
    checkpointing:
      monitor: "loss/total/val"
      save_top_k: 5
      mode: "min"
  hydra:
    job:
      name: ${experiment.name}
      chdir: false

clearml:
  project_name: "SymbolDetection"
  task_name: "orienternet_training"
  output_uri: true
  dataset_id: 7d56d648221f4c79ae045b0e4d6cb645
  # for YYC images: e5bce8143ec6423cac891a31f123bb9a
  # for e57: d39cb0ea44c04b23870dde88f8b7b583
  # orienternet_dataset_test: a0ca14beec574088b23e64820ad6e690